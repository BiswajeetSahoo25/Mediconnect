<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="packetGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1ABC9C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="packetGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48C9B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1ABC9C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDEBD0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5CBA7;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#E8F8F5" opacity="0.6"/>

  <!-- Medicine packet/sachet -->
  <g filter="url(#shadow6)">
    <!-- Main packet body -->
    <path d="M55 65 L145 65 L145 65 Q150 65 150 70 L150 120 Q150 145 125 145 L75 145 Q50 145 50 120 L50 70 Q50 65 55 65 Z" fill="url(#packetGrad1)"/>

    <!-- Tear notch at top -->
    <path d="M90 65 L95 75 L105 75 L110 65" fill="none" stroke="#16A085" stroke-width="3"/>

    <!-- Packet fold shade -->
    <rect x="55" y="135" width="90" height="8" rx="4" fill="#16A085" opacity="0.4"/>

    <!-- Packet highlight -->
    <rect x="60" y="70" width="30" height="60" rx="15" fill="url(#packetGrad2)" opacity="0.3"/>

    <!-- Powder visible through tear -->
    <ellipse cx="100" cy="82" rx="18" ry="10" fill="url(#tearGrad)"/>
    <ellipse cx="100" cy="80" rx="14" ry="6" fill="#FDEBD0" opacity="0.6"/>

    <!-- Powder granules -->
    <circle cx="92" cy="78" r="2" fill="#F5CBA7" opacity="0.8"/>
    <circle cx="105" cy="80" r="1.5" fill="#F5CBA7" opacity="0.7"/>
    <circle cx="96" cy="84" r="1.8" fill="#F5CBA7" opacity="0.6"/>
    <circle cx="108" cy="76" r="1.2" fill="#F5CBA7" opacity="0.5"/>

    <!-- Label area on packet -->
    <rect x="65" y="105" width="70" height="28" rx="4" fill="white" opacity="0.2"/>
    <rect x="75" y="112" width="50" height="3" rx="1.5" fill="white" opacity="0.3"/>
    <rect x="80" y="120" width="40" height="2.5" rx="1.25" fill="white" opacity="0.25"/>
  </g>

  <!-- Packet shine -->
  <path d="M60 72 Q58 85 62 110" stroke="white" stroke-width="2" fill="none" opacity="0.2" stroke-linecap="round"/>
</svg>
