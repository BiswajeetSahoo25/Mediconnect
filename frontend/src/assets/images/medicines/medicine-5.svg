<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="stripGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E44AD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C3483;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BB8FCE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E6BBF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#F4ECF7" opacity="0.6"/>

  <!-- Pill strip (folded) -->
  <g filter="url(#shadow5)">
    <!-- Main strip body -->
    <rect x="45" y="80" width="110" height="50" rx="8" fill="url(#stripGrad)"/>

    <!-- Strip fold/edge highlight -->
    <rect x="45" y="80" width="110" height="8" rx="8" fill="url(#stripGrad)" opacity="0.8"/>

    <!-- Pill pockets on strip (3 rows visible) -->
    <ellipse cx="75" cy="100" rx="16" ry="14" fill="#6C3483"/>
    <ellipse cx="100" cy="100" rx="16" ry="14" fill="#6C3483"/>
    <ellipse cx="125" cy="100" rx="16" ry="14" fill="#6C3483"/>

    <!-- Pills in pockets -->
    <ellipse cx="75" cy="98" rx="11" ry="10" fill="url(#pillGrad2)"/>
    <ellipse cx="100" cy="98" rx="11" ry="10" fill="url(#pillGrad2)"/>
    <ellipse cx="125" cy="98" rx="11" ry="10" fill="url(#pillGrad2)"/>

    <!-- Pill highlights -->
    <ellipse cx="71" cy="94" rx="4" ry="6" fill="white" opacity="0.3"/>
    <ellipse cx="96" cy="94" rx="4" ry="6" fill="white" opacity="0.3"/>
    <ellipse cx="121" cy="94" rx="4" ry="6" fill="white" opacity="0.3"/>

    <!-- Strip text area -->
    <rect x="55" y="115" width="90" height="8" rx="4" fill="white" opacity="0.2"/>
  </g>

  <!-- Strip top highlight -->
  <rect x="50" y="82" width="40" height="4" rx="2" fill="white" opacity="0.15"/>
</svg>
