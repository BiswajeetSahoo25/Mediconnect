<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="tabletGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E85D75;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4405A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tabletGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F07088;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D45068;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#FFF0F3" opacity="0.6"/>

  <!-- Round tablet -->
  <g filter="url(#shadow2)">
    <ellipse cx="100" cy="100" rx="60" ry="60" fill="url(#tabletGrad1)"/>
  </g>

  <!-- Tablet top highlight -->
  <ellipse cx="100" cy="100" rx="60" ry="60" fill="url(#tabletGrad2)" opacity="0.4"/>

  <!-- Shine on tablet surface -->
  <ellipse cx="75" cy="80" rx="22" ry="35" fill="white" opacity="0.2" transform="rotate(-30 75 80)"/>

  <!-- Score line on tablet -->
  <line x1="48" y1="100" x2="152" y2="100" stroke="white" stroke-width="3" opacity="0.3" stroke-linecap="round"/>

  <!-- Edge highlight -->
  <ellipse cx="100" cy="100" rx="60" ry="60" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>
</svg>
