<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bottleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B041;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E89E2D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E67E22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CA6F1E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDEBD0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F9E79F;stop-opacity:0.9" />
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#FEF5E7" opacity="0.6"/>

  <!-- Bottle -->
  <g filter="url(#shadow4)">
    <!-- Bottle body (cylinder) -->
    <rect x="65" y="90" width="70" height="70" rx="4" fill="url(#bottleGrad1)"/>

    <!-- Bottle neck -->
    <rect x="80" y="60" width="40" height="35" rx="4" fill="url(#bottleGrad2)"/>

    <!-- Bottle cap -->
    <rect x="75" y="45" width="50" height="20" rx="6" fill="url(#capGrad)"/>

    <!-- Liquid inside visible -->
    <rect x="68" y="115" width="64" height="40" rx="2" fill="url(#liquidGrad)"/>

    <!-- Liquid surface -->
    <ellipse cx="100" cy="115" rx="32" ry="4" fill="white" opacity="0.3"/>

    <!-- Liquid highlight -->
    <ellipse cx="85" cy="130" rx="10" ry="15" fill="white" opacity="0.2"/>
  </g>

  <!-- Bottle highlight -->
  <rect x="70" y="95" width="8" height="50" rx="4" fill="white" opacity="0.2"/>

  <!-- Label on bottle -->
  <rect x="72" y="100" width="56" height="25" rx="3" fill="white" opacity="0.25"/>
  <rect x="80" y="108" width="40" height="3" rx="1.5" fill="white" opacity="0.3"/>
  <rect x="85" y="116" width="30" height="2" rx="1" fill="white" opacity="0.2"/>
</svg>
