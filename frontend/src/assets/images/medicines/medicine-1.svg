<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="capsuleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E6AB0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capsuleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A7BB5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background subtle circle -->
  <circle cx="100" cy="100" r="90" fill="#EBF4FF" opacity="0.6"/>

  <!-- Capsule body -->
  <g filter="url(#shadow1)">
    <!-- Upper half -->
    <path d="M55 60 C55 42, 145 42, 145 60 L145 95 C145 110, 55 110, 55 95 Z" fill="url(#capsuleGrad1)"/>
    <!-- Lower half -->
    <path d="M55 105 C55 123, 145 123, 145 105 L145 95 C145 75, 55 75, 55 95 Z" fill="url(#capsuleGrad2)"/>
    <!-- Center divider -->
    <ellipse cx="100" cy="90" rx="45" ry="15" fill="#2E6AB0" opacity="0.3"/>
  </g>

  <!-- Highlight shine -->
  <ellipse cx="80" cy="72" rx="18" ry="8" fill="white" opacity="0.25" transform="rotate(-20 80 72)"/>
  <ellipse cx="80" cy="108" rx="18" ry="8" fill="white" opacity="0.2" transform="rotate(-20 80 108)"/>

  <!-- Text label area on capsule -->
  <rect x="75" y="82" width="50" height="6" rx="3" fill="white" opacity="0.3"/>
</svg>
