<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blisterGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E8449;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blisterGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#88C09B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D9E6F;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#EAFAF1" opacity="0.6"/>

  <!-- Blister pack body -->
  <g filter="url(#shadow3)">
    <rect x="55" y="50" width="90" height="100" rx="12" fill="url(#blisterGrad1)"/>

    <!-- Blister pockets (3 rows of 2) -->
    <ellipse cx="82" cy="72" rx="18" ry="16" fill="#1E8449"/>
    <ellipse cx="118" cy="72" rx="18" ry="16" fill="#1E8449"/>
    <ellipse cx="82" cy="105" rx="18" ry="16" fill="#1E8449"/>
    <ellipse cx="118" cy="105" rx="18" ry="16" fill="#1E8449"/>
    <ellipse cx="82" cy="138" rx="18" ry="16" fill="#1E8449"/>
    <ellipse cx="118" cy="138" rx="18" ry="16" fill="#1E8449"/>

    <!-- Pills in some pockets -->
    <ellipse cx="82" cy="70" rx="13" ry="11" fill="url(#pillGrad)"/>
    <ellipse cx="118" cy="70" rx="13" ry="11" fill="url(#pillGrad)"/>
    <ellipse cx="82" cy="103" rx="13" ry="11" fill="url(#pillGrad)"/>
    <ellipse cx="118" cy="103" rx="13" ry="11" fill="url(#pillGrad)"/>
    <ellipse cx="82" cy="136" rx="13" ry="11" fill="url(#pillGrad)"/>

    <!-- Pill highlights -->
    <ellipse cx="78" cy="67" rx="5" ry="8" fill="white" opacity="0.3"/>
    <ellipse cx="114" cy="67" rx="5" ry="8" fill="white" opacity="0.3"/>
    <ellipse cx="78" cy="100" rx="5" ry="8" fill="white" opacity="0.3"/>
    <ellipse cx="114" cy="100" rx="5" ry="8" fill="white" opacity="0.3"/>
    <ellipse cx="78" cy="133" rx="5" ry="8" fill="white" opacity="0.3"/>
  </g>

  <!-- Pack highlight -->
  <rect x="60" y="55" width="30" height="8" rx="4" fill="white" opacity="0.2"/>
</svg>
